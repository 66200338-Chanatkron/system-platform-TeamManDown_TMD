version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: tmd_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./src:/var/www/html
    depends_on:
      - postgres
      - mysql
      - nextjs
    networks:
      - backend

  postgres:
    image: postgres:15
    container_name: tmd_postgres
    restart: always
    environment: 
      POSTGRES_DB: mypgdb
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend

  mysql:
    image: mysql:5.7
    container_name: tmd_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: freeradius
    restart: always
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      - RADIUS_DEBUG=yes
    volumes:
      # Mount ไปที่ Temp เพื่อหลบปัญหา Permission 777 ของ Windows
      - ./freeradius:/tmp/radius-config
    # ใช้คำสั่งนี้ครับ (เปลี่ยน radiusd เป็น freeradius)
    command: >
      /bin/sh -c "
      cp -rf /tmp/radius-config/* /etc/raddb/ && 
      chown -R root:root /etc/raddb && 
      chmod -R o-w /etc/raddb && 
      ls -la /etc/raddb/sites-enabled/ && 
      /usr/sbin/freeradius -f -XX"
    depends_on:
      - mysql
    networks:
      - backend

  nextjs:
    container_name: tmd_nextjs
    restart: always
    build:
      context: ./nextjs
    ports:
      - "3000:3000"
    volumes:
      - ./nextjs:/app
      - /app/node_modules
    command: sh -c "ls -la /app && npm run dev"
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: tmd_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  # อีเมลสำหรับ login เข้าหน้าเว็บ pgAdmin
      PGADMIN_DEFAULT_PASSWORD: root          # รหัสผ่านสำหรับ login เข้าหน้าเว็บ pgAdmin
    ports:
      - "5050:80" 
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
  mysql_data: